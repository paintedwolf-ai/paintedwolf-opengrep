rules:
  - id: flow
    languages: [powershell]
    message: Executable input reaches a command sink
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: Read-Input
        exact: true
    pattern-sinks:
      - patterns:
          - pattern: Invoke-PwAuditSink $VALUE
          - focus-metavariable: $VALUE

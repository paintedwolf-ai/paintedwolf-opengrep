rules:
- id: express-flow
  languages: [javascript, typescript]
  severity: ERROR
  message: Registered HTTP input reaches evaluation
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-inside: import $FACTORY from "express"; ...
    - pattern: $FACTORY(...)
    - metavariable-name:
        metavariable: $FACTORY
        module: express
    exact: true
    label: HTTP_APP
  - patterns:
    - pattern-inside: import {Router as $FACTORY} from "express"; ...
    - pattern: $FACTORY(...)
    - metavariable-name:
        metavariable: $FACTORY
        module: express
    exact: true
    label: HTTP_APP
  - patterns:
    - pattern-inside: import * as $MODULE from "express"; ...
    - pattern: $MODULE.Router(...)
    - metavariable-name:
        metavariable: $MODULE
        module: express
    exact: true
    label: HTTP_APP
  - patterns:
    - pattern: $FACTORY = require("express")
    - metavariable-name:
        metavariable: $FACTORY
        module: express
    - focus-metavariable: $FACTORY
    exact: true
    by-side-effect: true
    label: HTTP_FACTORY
  - patterns:
    - pattern: 'const {Router: $FACTORY} = require("express");'
    - metavariable-name:
        metavariable: $FACTORY
        module: express
    - focus-metavariable: $FACTORY
    exact: true
    by-side-effect: true
    label: HTTP_FACTORY
  - patterns:
    - pattern: $FACTORY(...)
    - focus-metavariable: $FACTORY
    exact: true
    requires: HTTP_FACTORY
    label: HTTP_APP
  - patterns:
    - pattern: $FACTORY.Router(...)
    - focus-metavariable: $FACTORY
    exact: true
    requires: HTTP_FACTORY
    label: HTTP_APP
  - pattern-either:
    - pattern: $REQ.query
    - pattern: $REQ.body
    - pattern: $REQ.params
    exact: true
    requires: HTTP_REQUEST
    label: HTTP_VALUE
  pattern-propagators:
  - patterns:
    - pattern: $APP.$METHOD(..., ($REQ) => { ... }, ...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(get|post|put|patch|delete|head|options|all|use)$
    from: $APP
    to: $REQ
    requires: HTTP_APP
    label: HTTP_REQUEST
  - patterns:
    - pattern: $APP.$METHOD(..., ($REQ, $RES) => { ... }, ...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(get|post|put|patch|delete|head|options|all|use)$
    from: $APP
    to: $REQ
    requires: HTTP_APP
    label: HTTP_REQUEST
  - patterns:
    - pattern: $APP.$METHOD(..., ($REQ, $RES, $NEXT) => { ... }, ...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(get|post|put|patch|delete|head|options|all|use)$
    from: $APP
    to: $REQ
    requires: HTTP_APP
    label: HTTP_REQUEST
  - patterns:
    - pattern: $APP.$METHOD(..., function ($REQ) { ... }, ...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(get|post|put|patch|delete|head|options|all|use)$
    from: $APP
    to: $REQ
    requires: HTTP_APP
    label: HTTP_REQUEST
  - patterns:
    - pattern: $APP.$METHOD(..., function ($REQ, $RES) { ... }, ...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(get|post|put|patch|delete|head|options|all|use)$
    from: $APP
    to: $REQ
    requires: HTTP_APP
    label: HTTP_REQUEST
  - patterns:
    - pattern: $APP.$METHOD(..., function ($REQ, $RES, $NEXT) { ... }, ...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(get|post|put|patch|delete|head|options|all|use)$
    from: $APP
    to: $REQ
    requires: HTTP_APP
    label: HTTP_REQUEST
  pattern-sinks:
  - patterns:
    - pattern: $EVAL($CODE)
    - metavariable-name:
        metavariable: $EVAL
        kind: unbound
    - metavariable-regex:
        metavariable: $EVAL
        regex: ^eval$
    - focus-metavariable: $CODE
    requires: HTTP_VALUE

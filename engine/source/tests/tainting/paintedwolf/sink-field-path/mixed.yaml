rules:
- id: flow
  languages:
  - python
  severity: ERROR
  message: Selected destination receives external input
  mode: taint
  pattern-sources:
  - pattern: source()
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: sink($VALUE)
    - focus-metavariable: $VALUE
    value-path:
    - items
    - 0
    - url

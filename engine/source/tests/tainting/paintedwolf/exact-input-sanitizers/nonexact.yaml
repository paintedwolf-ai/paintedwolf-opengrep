{
  "rules": [
    {
      "id": "flow",
      "languages": [
        "javascript"
      ],
      "message": "Flow",
      "severity": "ERROR",
      "mode": "taint",
      "pattern-sources": [
        {
          "patterns": [
            {
              "pattern": "function $F($VALUE, ...) { ... }"
            },
            {
              "focus-metavariable": "$VALUE"
            }
          ],
          "exact": true
        },
        {
          "pattern": "source()",
          "exact": true
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern": "sink($VALUE)"
            },
            {
              "focus-metavariable": "$VALUE"
            }
          ]
        }
      ],
      "pattern-sanitizers": [
        {
          "patterns": [
            {
              "pattern": "function safe($VALUE, ...) { ... }"
            },
            {
              "focus-metavariable": "$VALUE"
            }
          ],
          "exact": false
        }
      ],
      "options": {
        "taint_intrafile": false
      }
    }
  ]
}

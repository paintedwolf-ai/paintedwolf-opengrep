{
  "rules": [
    {
      "id": "flow",
      "languages": [
        "javascript",
        "typescript"
      ],
      "message": "Function argument identity and capture",
      "severity": "ERROR",
      "mode": "taint",
      "options": {
        "taint_intrafile": true
      },
      "pattern-sources": [
        {
          "pattern": "source()",
          "exact": true
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern": "sink($VALUE)"
            },
            {
              "focus-metavariable": "$VALUE"
            }
          ]
        }
      ]
    }
  ]
}

rules:
- id: recursive-context
  languages:
  - javascript
  message: Recursive call preserves changed values
  severity: ERROR
  mode: taint
  options:
    taint_intrafile: true
  pattern-sources:
  - pattern: source()
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: sink($VALUE)
    - focus-metavariable: $VALUE

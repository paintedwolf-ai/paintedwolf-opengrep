{
  "rules": [
    {
      "id": "flow",
      "languages": [
        "powershell"
      ],
      "severity": "ERROR",
      "message": "Input flows through conditional branches",
      "mode": "taint",
      "options": {
        "taint_intrafile": true
      },
      "pattern-sources": [
        {
          "pattern": "Read-Input",
          "exact": true
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern": "Invoke-PwAuditSink $VALUE"
            },
            {
              "focus-metavariable": "$VALUE"
            }
          ]
        }
      ]
    }
  ]
}

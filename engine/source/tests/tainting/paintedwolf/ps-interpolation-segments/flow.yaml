{
  "rules": [
    {
      "id": "flow",
      "languages": [
        "powershell"
      ],
      "severity": "ERROR",
      "message": "Native string semantics",
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern": "Read-Input",
          "exact": true
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern": "Write-Output \"prefix $X suffix\""
            },
            {
              "focus-metavariable": "$X"
            }
          ]
        }
      ]
    }
  ]
}

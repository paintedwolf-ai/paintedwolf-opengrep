{
  "rules": [
    {
      "id": "origin",
      "languages": [
        "scheme"
      ],
      "message": "Modeled import identity",
      "severity": "ERROR",
      "patterns": [
        {
          "pattern": "($TYPE ...)"
        },
        {
          "metavariable-name": {
            "metavariable": "$TYPE",
            "module": "(guile)",
            "symbol": [
              "system"
            ],
            "imports": {
              "implicit": [
                "(guile)"
              ],
              "exports": [
                {
                  "module": "(web request)",
                  "symbol": "system",
                  "absent": true
                }
              ]
            }
          }
        },
        {
          "focus-metavariable": "$TYPE"
        }
      ]
    }
  ]
}

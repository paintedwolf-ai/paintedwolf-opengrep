{
  "rules": [
    {
      "id": "origin",
      "languages": [
        "swift"
      ],
      "message": "Modeled import identity",
      "severity": "ERROR",
      "patterns": [
        {
          "pattern": "func $H(..., $R: $TYPE, ...) { ... }"
        },
        {
          "metavariable-name": {
            "metavariable": "$TYPE",
            "module": "Vapor",
            "symbol": [
              "Request"
            ],
            "imports": {
              "exports": [
                {
                  "module": "Vapor",
                  "symbol": "Request",
                  "origin": {
                    "module": "Vapor",
                    "symbol": [
                      "Request"
                    ]
                  }
                }
              ]
            }
          }
        },
        {
          "focus-metavariable": "$R"
        }
      ]
    }
  ]
}

{
  "rules": [
    {
      "id": "exports",
      "languages": [
        "scheme"
      ],
      "severity": "ERROR",
      "message": "Resolved exported API",
      "patterns": [
        {
          "pattern": "($FN $VALUE)"
        },
        {
          "metavariable-name": {
            "metavariable": "$FN",
            "module": "(api)",
            "symbol": [
              "run"
            ],
            "imports": {
              "exports": [
                {
                  "module": "(other)",
                  "symbol": "unrelated",
                  "absent": true
                }
              ]
            }
          }
        }
      ]
    }
  ]
}

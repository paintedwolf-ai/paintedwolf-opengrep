{
  "rules": [
    {
      "id": "mapping-flow",
      "languages": [
        "python"
      ],
      "message": "Mapping copies preserve ordered fields",
      "severity": "ERROR",
      "mode": "taint",
      "options": {
        "taint_intrafile": true
      },
      "pattern-sources": [
        {
          "pattern": "source()",
          "exact": true
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern": "sink($VALUE)"
            },
            {
              "focus-metavariable": "$VALUE"
            }
          ]
        }
      ]
    }
  ]
}

{
  "rules": [
    {
      "id": "flow",
      "languages": [
        "python"
      ],
      "mode": "taint",
      "severity": "ERROR",
      "message": "flow",
      "options": {
        "taint_intrafile": true
      },
      "pattern-sources": [
        {
          "pattern": "source()",
          "exact": true
        }
      ],
      "pattern-sinks": [
        {
          "pattern": "sink($X)"
        }
      ]
    }
  ]
}

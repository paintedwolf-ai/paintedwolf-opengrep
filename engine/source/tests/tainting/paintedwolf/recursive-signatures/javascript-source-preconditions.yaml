rules:
- id: recursive-flow
  languages:
  - javascript
  message: Conditional source premises remain available
  severity: ERROR
  mode: taint
  options:
    taint_intrafile: true
    guarded_taint_signatures: true
  pattern-sources:
  - pattern: source()
    exact: true
    label: A
  - pattern: mark($VALUE)
    exact: true
    label: B
    requires: A
  pattern-sinks:
  - patterns:
    - pattern: sink($VALUE)
    - focus-metavariable: $VALUE
    requires: B

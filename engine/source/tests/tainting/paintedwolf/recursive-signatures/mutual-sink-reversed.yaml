rules:
- id: recursive-flow
  languages: [python]
  severity: ERROR
  message: Recursive helper flow
  mode: taint
  options:
    taint_intrafile: true
  pattern-sources:
  - pattern: source()
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: sink($VALUE)
    - focus-metavariable: $VALUE

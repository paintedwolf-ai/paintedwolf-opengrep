rules:
- id: flow
  languages: [clojure]
  severity: ERROR
  message: Selected root receives input
  mode: taint
  pattern-sources:
  - pattern: (source)
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: (sink $VALUE)
    - focus-metavariable: $VALUE
  options:
    taint_assume_safe_indexes: true

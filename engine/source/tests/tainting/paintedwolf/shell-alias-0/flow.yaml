{
  "rules": [
    {
      "id": "flow",
      "languages": [
        "python"
      ],
      "severity": "ERROR",
      "message": "Flow",
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern": "source()",
          "exact": true
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern": "os.system($X)"
            },
            {
              "focus-metavariable": "$X"
            }
          ]
        }
      ],
      "pattern-sanitizers": [
        {
          "pattern": "shlex.quote(...)",
          "exact": true,
          "output-value-type": "posix-shell-word"
        },
        {
          "pattern": "\"printf %s \" + $WORD",
          "exact": true,
          "requires-value-type": {
            "metavariable": "$WORD",
            "type": "posix-shell-word"
          }
        }
      ],
      "options": {
        "taint_intrafile": false
      }
    }
  ]
}

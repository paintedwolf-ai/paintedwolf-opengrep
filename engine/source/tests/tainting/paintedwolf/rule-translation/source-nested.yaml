{
  "rules": [
    {
      "id": "labels",
      "languages": [
        "javascript"
      ],
      "message": "Taint label translation",
      "severity": "ERROR",
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern": "source()",
          "label": "A"
        },
        {
          "pattern": "wrap($X)",
          "label": "CHECK",
          "requires": "(B or A) and not (B and A)"
        }
      ],
      "pattern-sinks": [
        {
          "pattern": "sink($X)",
          "requires": "CHECK"
        }
      ]
    }
  ]
}

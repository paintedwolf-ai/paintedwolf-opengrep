{
  "rules": [
    {
      "id": "flow",
      "languages": [
        "javascript"
      ],
      "severity": "ERROR",
      "message": "Flow",
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern": "source()",
          "exact": true
        }
      ],
      "pattern-sinks": [
        {
          "pattern": "sink(...)",
          "exact": true
        }
      ],
      "pattern-sanitizers": [
        {
          "pattern": "clean(...)",
          "exact": true
        }
      ],
      "options": {
        "taint_intrafile": true
      }
    }
  ]
}

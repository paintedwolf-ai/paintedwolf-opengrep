{
  "rules": [
    {
      "id": "syntax-location",
      "languages": [
        "perl"
      ],
      "message": "Retain flow beside malformed syntax",
      "severity": "ERROR",
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern": "source()",
          "exact": true
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern": "sink($VALUE)"
            },
            {
              "focus-metavariable": "$VALUE"
            }
          ]
        }
      ]
    }
  ]
}

{
  "rules": [
    {
      "id": "flow",
      "languages": [
        "python"
      ],
      "severity": "ERROR",
      "message": "Callback scalar guard",
      "mode": "taint",
      "options": {
        "taint_intrafile": false
      },
      "pattern-sources": [
        {
          "patterns": [
            {
              "pattern": "register($HANDLER)"
            },
            {
              "focus-metavariable": "$HANDLER"
            }
          ],
          "exact": true,
          "to-parameter": {
            "index": 0,
            "path": [],
            "arities": [
              1
            ]
          }
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern": "sink($VALUE)"
            },
            {
              "focus-metavariable": "$VALUE"
            }
          ]
        }
      ]
    }
  ]
}

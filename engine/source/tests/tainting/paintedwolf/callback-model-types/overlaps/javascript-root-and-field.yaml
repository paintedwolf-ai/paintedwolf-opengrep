{
  "rules": [
    {
      "id": "flow",
      "languages": [
        "javascript"
      ],
      "severity": "ERROR",
      "message": "Modeled callback parameter reaches its typed sink",
      "mode": "taint",
      "options": {
        "taint_intrafile": false
      },
      "pattern-sources": [
        {
          "patterns": [
            {
              "pattern": "register($HANDLER)"
            },
            {
              "focus-metavariable": "$HANDLER"
            }
          ],
          "exact": true,
          "model-type": "example.Request",
          "to-parameter": {
            "index": 0,
            "path": [],
            "arities": [
              1
            ]
          }
        },
        {
          "patterns": [
            {
              "pattern": "register($HANDLER)"
            },
            {
              "focus-metavariable": "$HANDLER"
            }
          ],
          "exact": true,
          "model-type": "example.Client",
          "to-parameter": {
            "index": 0,
            "path": [
              "client"
            ],
            "arities": [
              1
            ]
          },
          "label": "CLIENT"
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern": "sink($VALUE)"
            },
            {
              "focus-metavariable": "$VALUE"
            }
          ],
          "requires-model-type": {
            "metavariable": "$VALUE",
            "type": "example.Request"
          }
        },
        {
          "patterns": [
            {
              "pattern": "clientSink($VALUE)"
            },
            {
              "focus-metavariable": "$VALUE"
            }
          ],
          "requires-model-type": {
            "metavariable": "$VALUE",
            "type": "example.Client"
          },
          "requires": "CLIENT"
        }
      ]
    }
  ]
}

{
  "rules": [
    {
      "id": "conjunction",
      "languages": [
        "python"
      ],
      "severity": "ERROR",
      "message": "Labeled value reaches sink",
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern": "source_b()",
          "exact": true,
          "label": "B"
        },
        {
          "pattern": "source_a(...)",
          "exact": true,
          "label": "A",
          "requires": "B"
        },
        {
          "pattern": "source_d()",
          "exact": true,
          "label": "D"
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern": "sink_and($X)"
            },
            {
              "focus-metavariable": "$X"
            }
          ],
          "requires": "A and B"
        }
      ]
    },

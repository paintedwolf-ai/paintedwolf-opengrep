name: Packaging checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  packaging:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: ./task check
      - name: Prepare locked native packaging dependencies
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          python3 engine/build_support/native_release.py prepare-python --output "$RUNNER_TEMP/native-test-python"
          echo "PW_NATIVE_PACKAGING_PYTHON=$RUNNER_TEMP/native-test-python/bin/python" >> "$GITHUB_ENV"
      - run: ./task test
  check:
    if: always()
    needs: packaging
    runs-on: ubuntu-24.04
    steps:
      - name: Require packaging checks on every platform
        env:
          PACKAGING_RESULT: ${{ needs.packaging.result }}
        run: test "$PACKAGING_RESULT" = success

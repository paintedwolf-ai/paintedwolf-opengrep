name: Native release
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build a Developer ID release draft or validate signing credentials
        type: choice
        required: true
        default: build
        options:
          - build
          - check-signing
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: inputs.operation == 'build'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Require the reviewed unpublished version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_provenance.py preflight
      - run: ./task check
      - run: ./task test

  compile:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 360
    outputs:
      artifact-id: ${{ steps.handoff.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.3.0'
      - run: brew install opam pkgconf
      - name: Compile and qualify fresh unsigned inputs
        run: |
          set -euo pipefail
          python3 engine/build.py "$RUNNER_TEMP/native-work" --jobs 2
          mkdir "$RUNNER_TEMP/outgoing"
          python3 engine/build_support/native_release.py export --build-directory "$RUNNER_TEMP/native-work" --output "$RUNNER_TEMP/outgoing/handoff.tar.gz"
          python3 scripts/release_provenance.py build-evidence --build-directory "$RUNNER_TEMP/native-work" --handoff "$RUNNER_TEMP/outgoing/handoff.tar.gz" --output "$RUNNER_TEMP/outgoing/build-evidence.json"
      - id: handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/outgoing/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/native-work/contracts.jsonl
            ${{ runner.temp }}/native-work/platform-checks.json
            ${{ runner.temp }}/native-work/artifact/provenance.json
            ${{ runner.temp }}/native-work/inputs/source-lock.json

  sign-inner:
    needs: compile
    environment: signing
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.handoff.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.compile.outputs.artifact-id }}
          path: ${{ runner.temp }}/incoming
          merge-multiple: true
      - name: Validate workflow handoff and prepare trusted inspection
        run: |
          set -euo pipefail
          python3 scripts/release_provenance.py check-evidence --evidence "$RUNNER_TEMP/incoming/build-evidence.json" --handoff "$RUNNER_TEMP/incoming/handoff.tar.gz"
          python3 scripts/release_signing.py prepare --helper "$RUNNER_TEMP/signature-inspector"
      - name: Import the committed Developer ID identity
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/import-signing.sh
      - name: Sign without running artifact code or compilers
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/outgoing"
          python3 engine/build_support/native_release.py sign-inner --input "$RUNNER_TEMP/incoming/handoff.tar.gz" --output "$RUNNER_TEMP/outgoing/handoff.tar.gz" --inspector "$RUNNER_TEMP/signature-inspector" --signing-profile engine/signing/release-profile.json --identity "$OPENGREP_SIGN_IDENTITY" --keychain "$RUNNER_TEMP/opengrep-signing.keychain-db"
          cp "$RUNNER_TEMP/incoming/build-evidence.json" "$RUNNER_TEMP/outgoing/build-evidence.json"
      - name: Remove signing credentials
        if: always()
        run: bash scripts/cleanup-signing.sh
      - id: handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sign-inner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/outgoing/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package:
    needs: sign-inner
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.handoff.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.sign-inner.outputs.artifact-id }}
          path: ${{ runner.temp }}/incoming
          merge-multiple: true
      - name: Pack the signed distribution on a fresh runner without credentials
        run: |
          set -euo pipefail
          python3 scripts/release_provenance.py check-evidence --evidence "$RUNNER_TEMP/incoming/build-evidence.json"
          python3 engine/build_support/native_release.py prepare-python --output "$RUNNER_TEMP/package-python"
          mkdir "$RUNNER_TEMP/outgoing"
          "$RUNNER_TEMP/package-python/bin/python" engine/build_support/native_release.py package --input "$RUNNER_TEMP/incoming/handoff.tar.gz" --output "$RUNNER_TEMP/outgoing/handoff.tar.gz"
          cp "$RUNNER_TEMP/incoming/build-evidence.json" "$RUNNER_TEMP/outgoing/build-evidence.json"
      - id: handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/outgoing/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  sign-outer:
    needs: package
    environment: signing
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.handoff.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: ${{ runner.temp }}/incoming
          merge-multiple: true
      - name: Validate workflow handoff and prepare trusted inspection
        run: |
          set -euo pipefail
          python3 scripts/release_provenance.py check-evidence --evidence "$RUNNER_TEMP/incoming/build-evidence.json"
          python3 scripts/release_signing.py prepare --helper "$RUNNER_TEMP/signature-inspector"
      - name: Import the committed Developer ID identity
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/import-signing.sh
      - name: Sign without running artifact code or compilers
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/outgoing"
          python3 engine/build_support/native_release.py sign-outer --input "$RUNNER_TEMP/incoming/handoff.tar.gz" --output "$RUNNER_TEMP/outgoing/handoff.tar.gz" --inspector "$RUNNER_TEMP/signature-inspector" --signing-profile engine/signing/release-profile.json --identity "$OPENGREP_SIGN_IDENTITY" --keychain "$RUNNER_TEMP/opengrep-signing.keychain-db"
          cp "$RUNNER_TEMP/incoming/build-evidence.json" "$RUNNER_TEMP/outgoing/build-evidence.json"
      - name: Remove signing credentials
        if: always()
        run: bash scripts/cleanup-signing.sh
      - id: handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sign-outer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/outgoing/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  verify:
    needs: sign-outer
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      artifact-id: ${{ steps.release.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.sign-outer.outputs.artifact-id }}
          path: ${{ runner.temp }}/incoming
          merge-multiple: true
      - name: Verify signed bytes and every frozen contract on a clean runner
        run: |
          set -euo pipefail
          python3 scripts/release_provenance.py check-evidence --evidence "$RUNNER_TEMP/incoming/build-evidence.json"
          python3 engine/build_support/native_release.py prepare-python --output "$RUNNER_TEMP/verify-python"
          "$RUNNER_TEMP/verify-python/bin/python" engine/build_support/native_release.py verify --input "$RUNNER_TEMP/incoming/handoff.tar.gz" --output "$RUNNER_TEMP/artifact" --signing-profile engine/signing/release-profile.json
          python3 scripts/release.py --artifact "$RUNNER_TEMP/artifact" --output "$RUNNER_TEMP/release" --tag "$GITHUB_REF_NAME" --channel stable
          cp "$RUNNER_TEMP/incoming/build-evidence.json" "$RUNNER_TEMP/release/build-evidence.json"
      - id: release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: verify
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Recheck the reviewed release source and build identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release_provenance.py preflight
          python3 scripts/release_provenance.py check-evidence --evidence "$RUNNER_TEMP/release/build-evidence.json"
      - name: Attest the verified archive, descriptor, and original build evidence
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/release.json
            ${{ runner.temp }}/release/build-evidence.json
          create-storage-record: false
      - name: Create and verify a complete draft for human publication
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$ATTESTATION_BUNDLE" "$RUNNER_TEMP/release/provenance.sigstore.json"
          python3 scripts/promote.py "$RUNNER_TEMP/release"

  signing-check:
    if: inputs.operation == 'check-signing'
    environment: signing
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Prepare trusted signature inspector before importing credentials
        run: |
          set -euo pipefail
          python3 scripts/release_provenance.py identity
          python3 scripts/release_signing.py prepare --helper "$RUNNER_TEMP/signature-inspector"
      - name: Import the committed Developer ID identity
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/import-signing.sh
      - name: Check Developer ID signature and timestamp
        run: python3 scripts/release_signing.py check --helper "$RUNNER_TEMP/signature-inspector"
      - name: Remove signing credentials
        if: always()
        run: bash scripts/cleanup-signing.sh

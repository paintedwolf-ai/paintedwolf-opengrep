name: Native release
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build a release or only validate Developer ID signing credentials
        type: choice
        required: true
        default: build
        options:
          - build
          - check-signing
      channel:
        description: Ad-hoc prerelease or Developer ID stable release
        type: choice
        required: true
        default: prerelease
        options:
          - prerelease
          - stable
permissions:
  contents: write
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      RELEASE_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require an unpublished version tag
        if: inputs.operation == 'build'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          python3 - <<'PY'
          import json, os
          lock = json.load(open('engine/source-lock.json'))
          expected = 'v' + lock['upstream_version'] + '+paintedwolf.' + str(lock['patch_version'])
          if os.environ['GITHUB_REF_NAME'] != expected:
              raise SystemExit('Run this workflow at the exact engine version tag: ' + expected)
          PY
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json, os
          pages = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'releases.json')))
          for page in pages:
              for release in page:
                  if release['tag_name'] == os.environ['GITHUB_REF_NAME']:
                      raise SystemExit('This tag already has a release or draft; inspect it before retrying. Existing assets will not be replaced.')
          PY
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: inputs.operation == 'build'
        with:
          go-version: '1.26.6'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: inputs.operation == 'build'
        with:
          node-version: '26.3.0'
      - run: brew install opam pkgconf
        if: inputs.operation == 'build'
      - run: ./task check
        if: inputs.operation == 'build'
      - run: ./task test
        if: inputs.operation == 'build'
      - name: Import the release signing identity
        if: inputs.operation == 'check-signing' || inputs.channel == 'stable'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_SIGNING_IDENTITY"
          KEYCHAIN="$RUNNER_TEMP/opengrep-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signer.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signer.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security find-certificate -c "$APPLE_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$RUNNER_TEMP/signer.pem"
          openssl x509 -in "$RUNNER_TEMP/signer.pem" -outform DER -out "$RUNNER_TEMP/signer.der"
          python3 engine/signing/signing.py profile --certificate "$RUNNER_TEMP/signer.der" --output "$RUNNER_TEMP/signer.json"
          echo "OPENGREP_SIGNING_PROFILE=$RUNNER_TEMP/signer.json" >> "$GITHUB_ENV"
          echo "OPENGREP_SIGN_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/signer.p12" "$RUNNER_TEMP/signer.pem"
      - name: Validate Developer ID signing without building the engine
        if: inputs.operation == 'check-signing'
        run: python3 scripts/check-signing.py
      - name: Resolve cache identity
        if: inputs.operation == 'build'
        id: identity
        run: python3 scripts/cache-identity.py
      - id: cache
        if: inputs.operation == 'build'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.identity.outputs.artifact-directory }}
          key: ${{ steps.identity.outputs.cache-key }}
      - name: Build or fully admit the native artifact
        if: inputs.operation == 'build'
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIRECTORY="$(./task --silent build -- --jobs 2)"
          echo "ARTIFACT_DIRECTORY=$ARTIFACT_DIRECTORY" >> "$GITHUB_ENV"
      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: inputs.operation == 'build' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.identity.outputs.artifact-directory }}
          key: ${{ steps.identity.outputs.cache-key }}
      - name: Verify and package release
        if: inputs.operation == 'build'
        shell: bash
        run: |
          ./task release-pack -- --artifact "$ARTIFACT_DIRECTORY" --output "$RUNNER_TEMP/release" --tag "$GITHUB_REF_NAME" --channel "$RELEASE_CHANNEL"
      - name: Create a draft release
        if: inputs.operation == 'build'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OPTIONS=(--verify-tag --draft)
          if [[ "$RELEASE_CHANNEL" = prerelease ]]; then OPTIONS+=(--prerelease); fi
          printf 'Qualified native macOS arm64 engine. Channel: %s.\n\nSee release.json for exact source and archive identities.\n' "$RELEASE_CHANNEL" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${OPTIONS[@]}" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/release/"*
      - name: Retain failed native build diagnostics
        if: failure() && inputs.operation == 'build'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
          path: |
            /tmp/pwog-*/build.log
            /tmp/pwog-*/work/contracts.jsonl
            /tmp/pwog-*/work/platform-checks.json
            /tmp/pwog-*/work/artifact/provenance.json
            /tmp/pwog-*/work/artifact/source-lock.json
            .cache/artifacts/*.failed.json
      - name: Remove the job signing keychain
        if: always() && (inputs.operation == 'check-signing' || inputs.channel == 'stable')
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/opengrep-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/opengrep-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/signer.p12" "$RUNNER_TEMP/signer.pem"
